services:
  - type: web
    name: cv-optimizer-pro
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: DATABASE_URL
        fromDatabase:
          name: cv-optimizer-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: VITE_STRIPE_PUBLIC_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  - name: cv-optimizer-db
    databaseName: cv_optimizer
    user: cv_optimizer_user